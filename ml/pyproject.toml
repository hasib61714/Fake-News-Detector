[project]
name = "fakenews-ml"
version = "0.2.0"
description = "Training pipeline for the Fake News Detector classifier"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "scikit-learn>=1.5",
    "joblib>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
fnd-train = "fakenews_ml.train:main"
fnd-validate-data = "fakenews_ml.validate:main"
fnd-report = "fakenews_ml.report:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fakenews_ml*"]

[tool.setuptools.package-data]
fakenews_ml = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["fakenews_ml", "tests"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib.*"]
ignore_missing_imports = true
